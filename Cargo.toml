[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mock"
path = "tests/src/mock.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.82"
clap = { version = "4.0.27", features = ["derive", "string"] }
libc = "0.2.153"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
sysinfo = "0.38.4"
toml = "1.1.2"
itertools = "0.14.0"
avt = "0.17.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
assert_fs = "1.0"
tempfile = "3.3"
uuid = { version = "1.10.0", features = ["v4"]}
